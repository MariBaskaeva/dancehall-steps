spring:
  application:
    name: Dancehall-steps
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: ${DB_URL}
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
bot:
  token: ${BOT_TOKEN}
  name: ${BOT_NAME}
  greeting: classpath:static/start
server:
  port: ${APP_PORT}
logging:
  level:
    root: ERROR